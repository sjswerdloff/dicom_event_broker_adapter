# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^.*demographic\.000000$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb", "500"]
        exclude: ^.*yarn-.*cjs$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0  # Specify the latest Ruff version
    hooks:
      - id: ruff
        types: [python]
        args: [--fix, --exit-non-zero-on-fix, --line-length=127]

      - id: ruff-format
        types: [python]
  - repo: local
    hooks:
      - id: uv-export-requirements
        name: Export UV dependencies to requirements files
        language: python
        entry: python -c "import subprocess; subprocess.run(['uv', 'pip', 'export', '-r', 'uv.lock', '--only-packages', '--all-extras', '-o', 'requirements.txt'])"
        files: ^pyproject\.toml$|^uv\.lock$
        pass_filenames: false

      - id: uv-export-dev-requirements
        name: Export UV dev dependencies
        language: python
        entry: python -c "import subprocess; subprocess.run(['uv', 'pip', 'export', '-r', 'uv.lock', '--only-packages', '--extra', 'dev', '-o', 'requirements-dev.txt'])"
        files: ^pyproject\.toml$|^uv\.lock$
        pass_filenames: false
